[project]
name = "photo-triage"
version = "0.2.3"
description = "Local, offline semantic triage for folders full of images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# torch is declared only in the `model` extra, never in the base install.
# PyTorch ships a different wheel per accelerator (PROJECT.md 4a) and a plain
# resolver picks the CUDA one for everybody. `uv tool install` with
# --torch-backend rewrites the index for exactly these packages, which is the
# supported way to get the right build, so the extra is safe to declare and
# safe to leave out. Everything except embedding and text search runs without.
dependencies = [
    "flask>=3.0",
    "pillow>=10.0",
    "imagehash>=4.3",
    "numpy>=1.26",
    "av>=12.0",          # video frame sampling; bundles its own ffmpeg
]

[project.optional-dependencies]
# Install with `uv tool install "photo-triage[model]" --torch-backend=auto`,
# or --torch-backend=rocm6.3 on AMD, which uv's auto does not detect.
model = ["torch>=2.4", "torchvision>=0.19", "open_clip_torch>=2.24"]

[project.scripts]
photo-triage = "photo_triage.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photo_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
