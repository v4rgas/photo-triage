name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # No PyTorch anywhere in CI. The suite deliberately does not need it,
        # which is worth keeping true: if a test ever starts requiring the
        # model, this job is where it gets caught rather than in a release.
        run: uv pip install --system -e . pytest

      - name: Test
        run: python -m pytest -q
